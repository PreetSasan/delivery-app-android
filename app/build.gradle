apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'dagger.hilt.android.plugin'

android {
    compileSdk 36
    namespace "com.samadisolutions.deliveryapp"

    defaultConfig {
        applicationId "com.samadisolutions.deliveryapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SUPABASE_URL", '"https://your-project.supabase.co"'
        buildConfigField "String", "SUPABASE_ANON_KEY", '"your-supabase-key"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose false
    }
}

dependencies {
    // Core
    implementation "androidx.core:core-ktx:1.13.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0"

    // UI
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7"

    // Networking
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.google.code.gson:gson:2.10.1"

    // Database
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    // Supabase
    implementation "io.github.supabase:supabase-kt:0.26.0"
    implementation "io.github.supabase:gotrue-kt:0.26.0"
    implementation "io.github.supabase:storage-kt:0.26.0"
    implementation "io.github.supabase:postgrest-kt:0.26.0"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:33.0.0")
    implementation "com.google.firebase:firebase-analytics-ktx"
    implementation "com.google.firebase:firebase-messaging-ktx"

    // Google Play Services
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.android.gms:play-services-maps:18.2.0"

    // Maps
    implementation "com.google.maps.android:maps-ktx:3.4.0"
    implementation "com.google.maps.android:maps-compose:2.15.0"

    // Camera
    implementation "androidx.camera:camera-core:1.4.0-rc01"
    implementation "androidx.camera:camera-camera2:1.4.0-rc01"
    implementation "androidx.camera:camera-lifecycle:1.4.0-rc01"
    implementation "androidx.camera:camera-view:1.4.0-rc01"

    // Image
    implementation "com.squareup.picasso:picasso:2.8"

    // Dependency Injection
    implementation "com.google.dagger:hilt-android:2.50"
    kapt "com.google.dagger:hilt-compiler:2.50"
    implementation "androidx.hilt:hilt-navigation-fragment:1.2.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"

    // Logging
    implementation "com.jakewharton.timber:timber:5.0.1"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.6"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
